<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#21621c">
  <title>ROCOCO — Gestion du contenu</title><link rel="icon" type="image/png" href="../assets/rococo-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../admin.css">
</head>
<body><main class="admin-shell">
  <section id="dashboardView" class="dashboard" hidden>
    <aside class="admin-sidebar"><a class="admin-brand" href="../index.html"><img src="../assets/rococo-emblem.png" alt=""><span>ROCOCO<small>GESTION</small></span></a><nav aria-label="Sections de gestion"><button class="admin-tab active" data-panel="client-work">Galerie</button><button class="admin-tab" data-panel="seasonal">Collections saisonnières</button><button class="admin-tab" data-panel="services">Tarifs</button></nav><div class="sidebar-bottom"><a href="../gallery.html" target="_blank">Voir la galerie</a><a href="../index.html" target="_blank">Voir le site</a><button id="logoutButton">Déconnexion</button></div></aside>
    <div class="admin-main"><header class="admin-header"><div><p class="eyebrow">TABLEAU DE BORD</p><h1 id="panelTitle">Galerie</h1><p id="panelDescription" class="panel-description">Ajoutez, modifiez, masquez ou supprimez les photos de la galerie.</p></div><button id="addButton" class="primary-action">+ Ajouter une photo</button></header><div id="notice" class="notice" role="status" hidden></div><section id="itemsGrid" class="items-grid" aria-live="polite"></section></div>
  </section>
</main>
<div id="sessionCheck" class="session-check"><img src="../assets/rococo-emblem.png" alt=""><p>Vérification de la session…</p></div>
<dialog id="editorDialog"><form id="editorForm" class="editor-form"><div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">NOUVEL ÉLÉMENT</p><h2 id="dialogTitle">Ajouter</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Fermer">×</button></div><input type="hidden" id="recordId"><input type="hidden" id="currentImageUrl"><input type="hidden" id="currentStoragePath">
  <div id="imageFields"><label class="upload-zone" for="imageFile"><img id="imagePreview" alt="Aperçu" hidden><span id="uploadPrompt"><strong>Choisir une photo</strong><small>JPG, PNG ou WebP · maximum 8 Mo</small></span><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="form-grid"><label>Nom français<input id="titleFr" type="text"></label><label>Nom anglais<input id="titleEn" type="text"></label><label class="seasonal-only">Sous-titre français<input id="subtitleFr" type="text" placeholder="Taupe · Or"></label><label class="seasonal-only">Sous-titre anglais<input id="subtitleEn" type="text" placeholder="Taupe · Gold"></label></div></div>
  <div id="serviceFields" hidden><div class="form-grid"><label>Service en français<input id="nameFr" type="text"></label><label>Service en anglais<input id="nameEn" type="text"></label><label>Prix en français<input id="priceFr" type="text" placeholder="À partir de 45 $"></label><label>Prix en anglais<input id="priceEn" type="text" placeholder="Starting at $45"></label><label>Catégorie<select id="serviceCategory"><option value="manucure">Manucures</option><option value="extension">Extensions</option><option value="extra">Extras</option><option value="autre">Autres services</option></select></label></div></div>
  <div class="form-grid compact-grid"><label>Ordre d’affichage<input id="displayOrder" type="number" min="0" value="0"></label><label class="toggle-label"><input id="isVisible" type="checkbox" checked><span>Visible sur le site</span></label></div><div class="dialog-actions"><button type="button" class="secondary-action" id="cancelDialog">Annuler</button><button type="submit" class="primary-action" id="saveButton">Enregistrer</button></div>
</form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../admin.js"></script></body>
</html>
